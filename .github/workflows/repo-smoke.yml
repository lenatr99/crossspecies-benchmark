name: Repository smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install launcher
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q crossspecies_cli.py code

      - name: Check command routing
        run: |
          xspecies --help
          xspecies workflow
          RUN_DRY=1 xspecies prepare-data --dataset dicty
          RUN_DRY=1 xspecies ortholog-annotate --dataset dicty
          RUN_DRY=1 xspecies embed pca --dataset dicty
